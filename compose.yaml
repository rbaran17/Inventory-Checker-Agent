# docker compose up        -> app on http://localhost:8000 plus a Cloudflare quick tunnel for the phone
# docker compose up app    -> app only (bring your own HTTPS address via PUBLIC_BASE_URL)
name: inventory-checker

services:
  app:
    image: inventory-checker-agent:local
    build: .
    env_file:
      - path: .env
        required: false
    # Provider keys and other settings come from .env (see .env.example).
    # Leave PUBLIC_BASE_URL unset to use the tunnel below; the app reads its address automatically.
    environment:
      TUNNEL_METRICS_URL: http://tunnel:2000
      LAPTOP_URL: http://localhost:${APP_PORT:-8000}
      # X-Forwarded-For is believed only from the tunnel container (its fixed address below). Each phone is
      # then counted under its own address when a wrong key is tried, and nobody else can choose the address
      # they are counted under. Set FORWARDED_ALLOW_IPS in .env only if you put your own proxy in front.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-${TUNNEL_IP:-192.168.253.3}}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"   # laptop only; the phone comes in through the tunnel
    volumes:
      - app-data:/data                       # keeps the access key across restarts
    networks:
      default:
        ipv4_address: ${APP_IP:-192.168.253.2}
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2026.10.3}
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://app:8000
    depends_on:
      app:
        condition: service_healthy
    networks:
      default:
        ipv4_address: ${TUNNEL_IP:-192.168.253.3}
    restart: unless-stopped

# A small private network with fixed addresses, so the app knows which address the tunnel has. If Docker says
# the range overlaps another network, set NETWORK_SUBNET, APP_IP and TUNNEL_IP in .env (see docs/deployment.md).
networks:
  default:
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-192.168.253.0/29}

volumes:
  app-data:
