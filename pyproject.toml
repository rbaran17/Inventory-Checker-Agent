[project]
name = "inventory-checker-agent"
version = "0.4.0"
description = "Count and verify inventory with a phone camera: an AI agent on Microsoft Agent Framework identifies objects, reads serial and model numbers, and matches them to an audit sample."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Inventory-Checker-Agent contributors" }]
keywords = ["audit", "inventory", "computer-vision", "agents", "microsoft-agent-framework", "claude", "azure-openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "agent-framework-core>=1.23.0",
    "agent-framework-anthropic>=1.0.0b261022",
    "agent-framework-openai>=1.17.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "qrcode[pil]>=7.4",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
azure = ["azure-identity>=1.17"]   # keyless Azure OpenAI sign-in (Entra ID / managed identity)
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "build>=1.2"]

[project.scripts]
inventory-checker = "inventory_checker.cli:main"

[project.urls]
Homepage = "https://github.com/rbaran17/inventory-checker-agent"
Issues = "https://github.com/rbaran17/inventory-checker-agent/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inventory_checker = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
ignore = ["B008", "SIM102"]  # B008: FastAPI Depends/File/Form defaults are the framework idiom
