[project]
name = "inventory-checker-agent"
version = "0.2.0"
description = "Inventory count POC: phone camera video, object detection with Claude Haiku 5.5 on Microsoft Agent Framework, automatic match to the audit sample."
requires-python = ">=3.10"
dependencies = [
    "agent-framework-core>=1.23.0",
    "agent-framework-anthropic>=1.0.0b261022",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "qrcode[pil]>=7.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
inventory-checker = "inventory_checker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inventory_checker = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["B008", "SIM102"]  # B008: FastAPI Depends/File/Form defaults are the framework idiom
