[project]
name = "inventory-checker-agent"
version = "0.1.0"
description = "Physical inventory observation agent: phone camera capture, structured audit records and workpaper exports, built on Microsoft Agent Framework."
requires-python = ">=3.10"
dependencies = [
    "agent-framework-core>=1.23.0",
    "agent-framework-openai>=1.17.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "openpyxl>=3.1",
    "qrcode[pil]>=7.4",
]

[project.optional-dependencies]
azure = ["azure-identity>=1.17"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
inventory-checker = "inventory_checker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inventory_checker = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["B008", "SIM102"]  # B008: FastAPI Depends/File/Form defaults are the framework idiom
