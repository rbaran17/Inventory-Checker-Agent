name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,azure]"
      - run: ruff check src tests examples
      - run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: inventory-checker-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (health check, access key, pages)
        run: |
          docker run -d --name app -p 8000:8000 -e APP_ACCESS_KEY=ci inventory-checker-agent:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/state)" = 401
          curl -fsS -c jar "http://127.0.0.1:8000/?key=ci" -o /dev/null
          curl -fsS -b jar http://127.0.0.1:8000/api/state | python3 -c "import json,sys; s=json.load(sys.stdin); assert s['workspaces']['demo']['has_sample'] and s['active']=='engagement'"
          docker logs app
